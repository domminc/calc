# (선택) 수동 실행: R2 버킷과 Hyperdrive 를 미리 만든다. 이미 있으면 건너뛴다. — "배포" 워크플로가 같은 일을 하므로 보통 필요 없다.
# 필요한 Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (Neon 직접 연결 주소)
name: Cloudflare 처음 설정

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: R2 버킷
        run: |
          if npx wrangler r2 bucket list | grep -q "homesell-calc-files"; then
            echo "R2 버킷 homesell-calc-files 는 이미 있어요."
          else
            npx wrangler r2 bucket create homesell-calc-files
          fi
          # 내려받기 캐시(exports/)는 7일 뒤 자동 삭제 (예약 작업도 한 번 더 지운다)
          npx wrangler r2 bucket lifecycle add homesell-calc-files expire-exports exports/ --expire-days 7 || echo "수명주기 규칙은 이미 있거나 추가하지 못했어요 (예약 작업이 대신 지워요)."
      - name: Hyperdrive
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secrets 에 DATABASE_URL 이 없어요."; exit 1; fi
          existing="$(npx wrangler hyperdrive list | grep "homesell-calc-db" || true)"
          if [ -n "$existing" ]; then
            echo "Hyperdrive homesell-calc-db 는 이미 있어요:"
            echo "$existing"
          else
            npx wrangler hyperdrive create homesell-calc-db --connection-string="$DATABASE_URL" --caching-disabled
          fi
          echo "::notice::Hyperdrive 준비 완료. 배포 워크플로가 id 를 자동으로 찾아 써요."
