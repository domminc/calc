# main 에 올라가면: 검사 → Neon 마이그레이션(실패하면 멈춤) → 근거 원문 R2 업로드 → 배포 → /api/health 확인
# 저장소 Secrets : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL (Neon 직접 연결 주소)
# 저장소 Variables: HYPERDRIVE_ID (setup-cloudflare 워크플로가 알려 준다), HEALTH_URL (선택, 기본 workers.dev 주소)
# Workers Route(calc.homesell.co.kr/*)는 대시보드에서 만든 것으로, wrangler deploy 는 이를 지우지 않는다.
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 검사
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: DB 마이그레이션 (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_STRICT: "1"
        run: node scripts/migrate.mjs
      - name: 빌드
        run: npm run build
      - name: 설정 확인
        env:
          HYPERDRIVE_ID: ${{ vars.HYPERDRIVE_ID }}
        run: |
          if [ -z "$HYPERDRIVE_ID" ]; then echo "::error::저장소 Variables 에 HYPERDRIVE_ID 가 없어요. 'Cloudflare 처음 설정' 워크플로를 먼저 실행하세요."; exit 1; fi
          sed -i "s/00000000000000000000000000000000/$HYPERDRIVE_ID/" wrangler.jsonc
      - name: 근거 원문 R2 업로드
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in $(cd data/source && find . -type f \( -name '*.pdf' -o -name '*.txt' \) | sed 's|^\./||'); do
            ct=$(case "$f" in *.pdf) echo application/pdf;; *) echo "text/plain; charset=utf-8";; esac)
            npx wrangler r2 object put "homesell-calc-files/sources/$f" --file "data/source/$f" --content-type "$ct" --remote
          done
      - name: 배포
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var "ASSET_VERSION:${GITHUB_SHA::8}"
      - name: 상태 확인
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          url="${HEALTH_URL:-https://homesell-calc.richislet.workers.dev/api/health}"
          for i in 1 2 3 4 5 6; do
            out="$(curl -fsS -m 15 "$url" || true)"
            echo "$out"
            echo "$out" | grep -q '"상태":"정상"' && exit 0
            sleep 10
          done
          echo "::error::배포 후 상태 확인에 실패했어요: $url"
          exit 1
